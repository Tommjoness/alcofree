<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nuchter" />
  <meta name="theme-color" content="#07090f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Nuchter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --s1: #0c0f1a;
      --s2: #111520;
      --s3: #181d2c;
      --border: #1e2438;
      --accent: #c4b5fd;
      --accent2: #6ee7b7;
      --gold: #fcd34d;
      --text: #f1f5ff;
      --text2: #c8d0e8;
      --muted: #6b7a99;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Outfit', system-ui, sans-serif;
    }

    html { height: 100%; }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
      padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
      color-scheme: dark;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.4;
    }

    .glow-a { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, #7c3aed18 0%, transparent 70%); top: -200px; left: -100px; pointer-events: none; z-index: 0; }
    .glow-b { position: fixed; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, #06b6d412 0%, transparent 70%); bottom: 0; right: -100px; pointer-events: none; z-index: 0; }

    .app {
      position: relative; z-index: 1;
      max-width: 390px; margin: 0 auto;
      padding: 0 18px 40px;
    }

    .header {
      padding: 60px 0 32px;
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }

    .header-eyebrow {
      font-size: 10px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted);
    }

    .header-title {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(38px, 11vw, 48px);
      font-weight: 400;
      letter-spacing: -0.5px;
      line-height: 1;
      color: var(--text);
    }

    .header-title em { color: var(--accent); font-style: normal; }

    .tabs {
      display: flex; gap: 2px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 3px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1; padding: 10px 8px;
      border: none; border-radius: 11px;
      font-family: var(--font-sans);
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.3px;
      cursor: pointer; transition: all 0.2s;
      background: none; color: var(--muted);
    }

    .tab.active { background: var(--s3); color: var(--text); box-shadow: 0 1px 8px #00000040; }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .page { display: none; }
    .page.active { display: flex; flex-direction: column; gap: 12px; }

    .counter-block {
      background: var(--s1);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 24px 36px;
      text-align: center;
      position: relative; overflow: hidden;
    }

    .counter-block::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .days-number {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 400;
      font-size: clamp(88px, 26vw, 120px);
      letter-spacing: -4px;
      line-height: 0.9;
      color: var(--text);
      display: block;
    }

    .days-label {
      font-size: 11px; font-weight: 400;
      letter-spacing: 4px; text-transform: uppercase;
      color: var(--muted);
      margin-top: 14px;
      display: block;
    }

    .time-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .time-card {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px 8px;
      text-align: center; display: flex; flex-direction: column; gap: 4px;
    }

    .time-val {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 26px; font-weight: 400;
      color: var(--text2); line-height: 1;
    }

    .time-unit {
      font-size: 9px; font-weight: 500;
      color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
    }

    .money-block {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 22px; padding: 28px 24px;
      text-align: center; position: relative; overflow: hidden;
    }

    .money-block::before {
      content: '';
      position: absolute; top: 0; left: 25%; right: 25%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.6;
    }

    .money-label {
      font-size: 10px; font-weight: 500;
      color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
      margin-bottom: 10px;
    }

    .money-amount {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(40px, 12vw, 54px);
      font-weight: 400; letter-spacing: -1px;
      color: var(--gold); line-height: 1;
    }

    .milestones-block {
      background: var(--s1); border: 1px solid var(--border);
      border-radius: 22px; padding: 22px 20px;
    }

    .block-title {
      font-size: 10px; font-weight: 500;
      color: var(--muted); letter-spacing: 3px; text-transform: uppercase;
      margin-bottom: 16px; text-align: center;
    }

    .milestone-list { display: flex; flex-direction: column; gap: 6px; }

    .milestone-item { border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: border-color 0.2s; }
    .milestone-item.done { background: #0a1a12; border-color: #1a3d22; }
    .milestone-item.next { border-color: #3d2f6e; background: #0e0a1a; }
    .milestone-item:not(.done):not(.next):hover { border-color: #2a3050; }

    .milestone-header {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; cursor: pointer; user-select: none;
      border: 0; background: transparent; color: inherit; font: inherit; text-align: left;
    }
    .milestone-header:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    .milestone-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .milestone-item.done .milestone-dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
    .milestone-item.next .milestone-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s ease infinite; }
    .milestone-item:not(.done):not(.next) .milestone-dot { background: var(--border); }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .milestone-days { font-size: 12px; font-weight: 400; flex: 1; color: var(--text2); }
    .milestone-item:not(.done):not(.next) .milestone-days { color: var(--muted); }

    .milestone-badge {
      font-size: 10px; font-weight: 500;
      padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
    }
    .milestone-item.done .milestone-badge { background: #0d2a1a; color: var(--accent2); }
    .milestone-item.next .milestone-badge { background: #1a1030; color: var(--accent); }

    .milestone-chevron {
      font-size: 9px; color: var(--muted); flex-shrink: 0;
      transition: transform 0.25s; opacity: 0.6;
    }
    .milestone-item.open .milestone-chevron { transform: rotate(180deg); }

    .milestone-fact-wrap { display: none; padding: 0 14px 12px 32px; }
    .milestone-item.open .milestone-fact-wrap { display: block; }
    .milestone-fact { font-size: 12px; line-height: 1.7; font-weight: 300; color: var(--muted); }
    .milestone-item.done .milestone-fact { color: #5a9a6a; }
    .milestone-item.next .milestone-fact { color: #8a72cc; }

    .milestone-note {
      margin-top: 14px;
      font-size: 10px;
      line-height: 1.55;
      text-align: center;
      color: var(--muted);
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<div class="glow-a"></div>
<div class="glow-b"></div>

<div class="app">
  <header class="header">
    <div class="header-eyebrow">Persoonlijk</div>
    <div class="header-title">Nuchter<em>.</em></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Nuchter overzicht">
    <button class="tab active" id="tab-vandaag" type="button" role="tab" aria-selected="true" aria-controls="page-vandaag" onclick="switchTab('vandaag')">Vandaag</button>
    <button class="tab" id="tab-mijlpalen" type="button" role="tab" aria-selected="false" aria-controls="page-mijlpalen" onclick="switchTab('mijlpalen')">Mijlpalen</button>
  </div>

  <main>
    <section class="page active" id="page-vandaag" role="tabpanel" aria-labelledby="tab-vandaag">
      <div class="counter-block">
        <span class="days-number" id="daysNumber">0</span>
        <span class="days-label" id="daysLabel">dagen nuchter</span>
      </div>

      <div class="time-row">
        <div class="time-card">
          <div class="time-val" id="hoursVal">0</div>
          <div class="time-unit">Uren</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="weeksVal">0</div>
          <div class="time-unit">Weken</div>
        </div>
        <div class="time-card">
          <div class="time-val" id="monthsVal">0</div>
          <div class="time-unit">Maanden</div>
        </div>
      </div>

      <div class="money-block">
        <div class="money-label">Geld bespaard</div>
        <div class="money-amount" id="moneyAmount">€ 0,00</div>
      </div>
    </section>

    <section class="page" id="page-mijlpalen" role="tabpanel" aria-labelledby="tab-mijlpalen" hidden>
      <div class="milestones-block">
        <div class="block-title">Mijlpalen</div>
        <div class="milestone-list" id="milestoneList"></div>
        <p class="milestone-note">Gezondheidseffecten verschillen per persoon. Deze mijlpalen zijn motivatie, geen vaste medische tijdlijn.</p>
      </div>
    </section>
  </main>
</div>

<script>
  const TIME_ZONE = 'Europe/Amsterdam';
  const START_AT = new Date('2026-08-20T00:00:00+02:00');
  const START_DATE = { year: 2026, month: 8, day: 20 };
  const RATE = 43.35;
  const DAY_MS = 86400000;
  const HOUR_MS = 3600000;

  const dateFormatter = new Intl.DateTimeFormat('en-GB', {
    timeZone: TIME_ZONE,
    year: 'numeric',
    month: 'numeric',
    day: 'numeric',
  });

  const MILESTONES = [
    { days: 1, fact: 'Je eerste volledige alcoholvrije dag. Vanaf hier bouw je je eigen reeks op, één kalenderdag tegelijk.' },
    { days: 3, fact: 'Drie dagen op rij. Alcohol kan slaap verstoren; zonder alcohol krijgt je slaapritme ruimte om zich te herstellen. Hoe snel je iets merkt verschilt per persoon.' },
    { days: 7, fact: 'Een volle week. Minder of geen alcohol verlaagt je blootstelling aan alcoholgerelateerde gezondheidsrisico’s.' },
    { days: 14, fact: 'Twee weken. Let vooral op je eigen slaap, energie en stemming: herstel verloopt niet volgens één vaste tijdlijn.' },
    { days: 21, fact: 'Drie weken. De belangrijkste winst hier is consistentie: je hebt 21 dagen achter elkaar een nieuw patroon volgehouden.' },
    { days: 30, fact: 'Een maand. Langdurig minder of niet drinken is gunstiger voor de gezondheid dan meer drinken en vermindert de belasting door alcohol.' },
    { days: 50, fact: 'Vijftig dagen. Je reeks wordt steeds sterker; gezondheidsveranderingen blijven individueel.' },
    { days: 60, fact: 'Twee maanden. Minder alcohol hangt samen met minder risico op onder meer hoge bloeddruk, leverziekte en slechte slaap.' },
    { days: 75, fact: '75 dagen. Bijna elf weken alcoholvrij — een stevige reeks, zonder te doen alsof ieder lichaam op exact dag 75 hetzelfde verandert.' },
    { days: 100, fact: '100 dagen. Een duidelijke mijlpaal: honderd kalenderdagen zonder nieuwe alcoholconsumptie.' },
    { days: 180, fact: 'Een half jaar. Langdurig minder of niet drinken verlaagt alcoholgerelateerde gezondheidsrisico’s ten opzichte van meer drinken.' },
    { days: 365, fact: 'Een jaar. Een volledig alcoholvrij jaar is een grote gedragsmijlpaal; de precieze gezondheidswinst hangt af van persoon, voorgeschiedenis en eerdere inname.' },
  ];

  function getDateParts(date) {
    const parts = dateFormatter.formatToParts(date);
    const values = {};
    for (const part of parts) {
      if (part.type !== 'literal') values[part.type] = Number(part.value);
    }
    return { year: values.year, month: values.month, day: values.day };
  }

  function calendarDayIndex(parts) {
    return Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day) / DAY_MS);
  }

  function getDays(now) {
    return Math.max(0, calendarDayIndex(getDateParts(now)) - calendarDayIndex(START_DATE));
  }

  function getHours(now) {
    return Math.max(0, Math.floor((now - START_AT) / HOUR_MS));
  }

  function getFullMonths(now) {
    const current = getDateParts(now);
    let months = (current.year - START_DATE.year) * 12 + (current.month - START_DATE.month);
    if (current.day < START_DATE.day) months -= 1;
    return Math.max(0, months);
  }

  function toggleMilestone(button) {
    const item = button.closest('.milestone-item');
    const isOpen = item.classList.toggle('open');
    button.setAttribute('aria-expanded', String(isOpen));
  }

  function render() {
    const now = new Date();
    const days = getDays(now);
    const hours = getHours(now);
    const weeks = Math.floor(days / 7);
    const months = getFullMonths(now);
    const elapsedMs = Math.max(0, now - START_AT);
    const saved = (elapsedMs / DAY_MS / 7) * RATE;

    document.getElementById('daysNumber').textContent = days;
    document.getElementById('daysLabel').textContent = days === 1 ? 'dag nuchter' : 'dagen nuchter';
    document.getElementById('hoursVal').textContent = hours.toLocaleString('nl-NL');
    document.getElementById('weeksVal').textContent = weeks;
    document.getElementById('monthsVal').textContent = months;
    document.getElementById('moneyAmount').textContent = '€ ' + saved.toFixed(2).replace('.', ',');

    const nextMilestone = MILESTONES.find(m => m.days > days);

    document.getElementById('milestoneList').innerHTML = MILESTONES.map(m => {
      const done = days >= m.days;
      const isNext = Boolean(nextMilestone && m.days === nextMilestone.days);
      const remaining = Math.max(0, m.days - days);
      const label = m.days === 1 ? '1 dag' : m.days + ' dagen';
      let badge = '';

      if (done) badge = '<span class="milestone-badge">✓ behaald</span>';
      else if (isNext) badge = '<span class="milestone-badge">nog ' + remaining + 'd</span>';

      return '<div class="milestone-item ' + (done ? 'done' : isNext ? 'next' : '') + '">' +
        '<button class="milestone-header" type="button" aria-expanded="false" onclick="toggleMilestone(this)">' +
          '<span class="milestone-dot" aria-hidden="true"></span>' +
          '<span class="milestone-days">' + label + '</span>' +
          badge +
          '<span class="milestone-chevron" aria-hidden="true">▼</span>' +
        '</button>' +
        '<div class="milestone-fact-wrap"><div class="milestone-fact">' + m.fact + '</div></div>' +
      '</div>';
    }).join('');
  }

  function switchTab(tab) {
    const tabs = ['vandaag', 'mijlpalen'];
    for (const name of tabs) {
      const isActive = name === tab;
      const tabButton = document.getElementById('tab-' + name);
      const page = document.getElementById('page-' + name);
      tabButton.classList.toggle('active', isActive);
      tabButton.setAttribute('aria-selected', String(isActive));
      page.classList.toggle('active', isActive);
      page.hidden = !isActive;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
  }

  render();
  setInterval(render, 60000);
</script>
</body>
</html>
